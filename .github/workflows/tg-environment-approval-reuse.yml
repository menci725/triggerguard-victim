name: TriggerGuard Environment Approval Reuse

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tg-env-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  environment-gated:
    runs-on: ubuntu-latest
    environment: external
    steps:
      - name: Record approved run context
        run: |
          echo "event=${{ github.event_name }}"
          echo "action=${{ github.event.action }}"
          echo "pr=${{ github.event.pull_request.number }}"
          echo "head_sha=${{ github.event.pull_request.head.sha }}"
          echo "base_sha=${{ github.event.pull_request.base.sha }}"

      - name: Checkout PR head after environment approval
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record checked-out commit
        run: |
          mkdir -p triggerguard-env-proof
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "head_sha=${{ github.event.pull_request.head.sha }}"
            echo "checked_out=$(git rev-parse HEAD)"
            date -u +"timestamp=%Y-%m-%dT%H:%M:%SZ"
          } | tee triggerguard-env-proof/context.txt

      - name: Upload context artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-env-approval-context
          path: triggerguard-env-proof/context.txt
